<title>ER Bed Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pinned top bar over a dotted floor-plan canvas of bed cards; tapping a bed slides in its chart drawer (full-screen sheet on phones). */
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface-2:#F3F6F8; --fg:#13202A; --muted:#566673; --line:#CBD6DF; --dot:#B7C4CF;
  --accent:#2B6898; --accent-fg:#FFFFFF; --focus:#2B6898;
  --tile:#2F6E9E; --tile-hi:#3A7DAF; --tile-fg:#F4F9FD; --tile-muted:#C6DAEA; --tile-line:rgb(255 255 255 / .22);
  --warn:#9A5B00; --warn-bg:#FFE6BA; --ok:#16704A; --ok-bg:#D2F0DD; --danger:#B42318; --danger-bg:#FCE3DF;
  --pill-warn-bg:#FFD27A; --pill-warn-fg:#3A2500; --pill-ok-bg:#9FE3BD; --pill-ok-fg:#0B3320;
  --c-mgh:#1B8553; --c-admit:#6447BF; --c-transfer:#B4570F; --c-hama:#B42318; --c-absc:#5E6672;
  --shadow:0 1px 2px rgb(15 30 45 / .14), 0 8px 22px rgb(15 30 45 / .12);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#151E26; --surface-2:#1B2630; --fg:#E3EBF1; --muted:#8D9EAB; --line:#28363F; --dot:#25323C;
  --accent:#62A8DC; --accent-fg:#06131D; --focus:#7DBAE6;
  --tile:#2A6390; --tile-hi:#33719F; --tile-fg:#F1F7FC; --tile-muted:#BBD3E6; --tile-line:rgb(255 255 255 / .18);
  --warn:#F2B049; --warn-bg:#3A2A0F; --ok:#4FCB8E; --ok-bg:#103022; --danger:#F27866; --danger-bg:#3B1713;
  --shadow:0 1px 2px rgb(0 0 0 / .5), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#151E26; --surface-2:#1B2630; --fg:#E3EBF1; --muted:#8D9EAB; --line:#28363F; --dot:#25323C;
  --accent:#62A8DC; --accent-fg:#06131D; --focus:#7DBAE6;
  --tile:#2A6390; --tile-hi:#33719F; --tile-fg:#F1F7FC; --tile-muted:#BBD3E6; --tile-line:rgb(255 255 255 / .18);
  --warn:#F2B049; --warn-bg:#3A2A0F; --ok:#4FCB8E; --ok-bg:#103022; --danger:#F27866; --danger-bg:#3B1713;
  --shadow:0 1px 2px rgb(0 0 0 / .5), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="live"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--danger)}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.stat{display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--f-mono);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.stat.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)} .stat.warn b{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sizer{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sizer svg{width:14px;height:14px;flex:none}
.sizer svg.big{width:20px;height:20px}
.sizer input{width:120px;accent-color:var(--accent);margin:0;cursor:pointer}
.sizer output{font-family:var(--f-mono);font-size:12px;min-width:4ch;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.1}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.banner{padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line)}
.banner.info{background:var(--surface-2);color:var(--muted)}

/* Board */
.board{flex:1;overflow:auto;position:relative;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-attachment:local}
.canvas{position:relative;min-width:100%;min-height:100%}
.arrange-note{position:sticky;top:12px;left:0;margin:12px auto 0;width:max-content;max-width:calc(100% - 32px);z-index:3;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.state{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.state h2{font-family:var(--f-display);font-size:28px;margin:0 0 6px;color:var(--fg);text-transform:uppercase;letter-spacing:.02em}
.state p{margin:0 0 14px;max-width:44ch}

.tile{position:absolute;box-sizing:border-box;width:214px;border-radius:18px;background:var(--tile);color:var(--tile-fg);padding:12px 14px 12px;box-shadow:var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;border:2px solid transparent;display:flex;flex-direction:column;gap:7px;text-align:left;transform:scale(var(--s,1));transform-origin:0 0;transition:box-shadow .15s, transform .15s, left .22s ease, top .22s ease}
.canvas.resizing .tile{transition:none}
.tile:hover{background:var(--tile-hi)}
.tile.sel{border-color:var(--fg);outline:3px solid var(--accent);outline-offset:2px}
.tile.empty{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--muted);border:2px dashed var(--line);box-shadow:none}
.tile.empty:hover{border-color:var(--accent);color:var(--fg)}
.tile{touch-action:manipulation}
.arranging .tile{cursor:grab;touch-action:none}
.arranging .tile.dragging{transition:none;cursor:grabbing;transform:scale(calc(var(--s,1) * 1.03));box-shadow:0 18px 40px rgb(0 0 0 / .3);z-index:4}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.t-bed{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dchip{flex:none;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;background:var(--c-mgh)}
.dchip.Admit{background:var(--c-admit)} .dchip.Transfer{background:var(--c-transfer)} .dchip.HAMA{background:var(--c-hama)}
.t-pt{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-pt span{font-weight:400;color:var(--tile-muted)}
.t-cc{font-size:14px;color:var(--tile-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.4em}
.t-vit{font-family:var(--f-mono);font-size:11.5px;color:var(--tile-fg);opacity:.92;border-top:1px solid var(--tile-line);padding-top:7px;display:flex;flex-wrap:wrap;gap:2px 9px;font-variant-numeric:tabular-nums}
.t-vit em{font-style:normal;color:var(--tile-muted)}
.segs{display:flex;flex-wrap:wrap;gap:3px}
.segs i{width:12px;height:7px;border-radius:2px;border:1.5px solid var(--tile-muted);display:block}
.segs i.d{background:var(--pill-ok-bg);border-color:var(--pill-ok-bg)}
.segs i.tx{border-radius:7px}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.pill{font-weight:700;padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-fg)}
.pill.ok{background:var(--pill-ok-bg);color:var(--pill-ok-fg)}
.pill.none{background:var(--tile-line);color:var(--tile-fg)}
.los{font-family:var(--f-mono);color:var(--tile-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tile.expanded{width:400px;z-index:3;cursor:pointer;gap:10px;padding:14px 16px 14px}
.tile.expanded:hover{background:var(--tile-hi)}
.tile.expanded .t-head{cursor:pointer}
.tile.expanded > .los{font-size:12.5px}
.tile.expanded .t-cc{-webkit-line-clamp:unset;display:block;color:var(--tile-fg)}
.x-sec{border-top:1px solid var(--tile-line);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.x-sec h5{margin:0;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tile-muted);display:flex;justify-content:space-between;gap:8px}
.x-sec h5 small{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:400;font-size:12px}
.x-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.x-list li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;font-size:14.5px;padding:4px 6px 4px 2px;border-radius:8px}
.x-list li.done .xt{text-decoration:line-through;color:var(--tile-muted)}
.xcb{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--tile-fg);border-radius:6px;background:transparent;cursor:pointer;display:grid;place-items:center}
.xcb:checked{background:var(--pill-ok-bg);border-color:var(--pill-ok-bg)}
.xcb:checked::after{content:"";width:5px;height:10px;border:solid var(--pill-ok-fg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.xcb:disabled{cursor:default;opacity:.8}
.xby{display:block;font-size:11.5px;color:var(--pill-ok-bg)}
.x-none{font-size:13px;color:var(--tile-muted)}
.x-txt{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.x-dn{font-size:14px;color:var(--tile-fg)}
.x-edit{align-self:flex-start;border:0;background:var(--tile-fg);color:var(--tile);font-weight:700;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:14px}
.x-edit:hover{filter:brightness(.94)}
.t-empty{display:flex;flex-direction:column;gap:2px;padding:14px 0 12px;font-size:14px}
.t-empty b{color:var(--fg);font-weight:700}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgb(5 12 18 / .35);z-index:8}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:9;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.p-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bed-input{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-6px;background:transparent}
.bed-input:hover,.bed-input:focus{border-color:var(--line);background:var(--surface-2)}
.p-body{flex:1;overflow:auto;padding:4px 18px 28px;display:flex;flex-direction:column}
.tedit{border:0;border-bottom:1px dashed currentColor;background:transparent;color:inherit;font-family:var(--f-mono);font-size:12px;padding:0 1px;border-radius:0;cursor:pointer}
.tedit:hover{background:var(--surface)}
.tedit:disabled{border-bottom-color:transparent;cursor:default}
.sec{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 small{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:12px;font-weight:400}
.row{display:grid;grid-template-columns:1fr 72px 72px;gap:8px}
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea,.add input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface-2);font-size:15px;color:var(--fg);min-width:0}
.fld textarea{resize:vertical;min-height:44px}
.vitals input{font-family:var(--f-mono);font-size:14px;padding:8px 6px;text-align:center}
.fld input:focus,.fld select:focus,.fld textarea:focus,.add input:focus{outline:2px solid var(--focus);outline-offset:0;background:var(--surface)}
.hint{font-size:12px;color:var(--muted)}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.inline input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface-2);font-family:var(--f-mono);font-size:13px}
.inline b{color:var(--fg);font-family:var(--f-mono);font-weight:500}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:7px 8px 7px 6px;border-radius:10px;background:var(--surface-2)}
.checks li.done{background:var(--ok-bg)}
.checks li.done .ct{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.cb{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:7px;margin:0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.cb:checked{background:var(--ok);border-color:var(--ok)}
.cb:checked::after{content:"";width:6px;height:12px;border:solid var(--surface);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.cb:disabled{cursor:not-allowed;opacity:.7}
.ct{min-width:0;overflow-wrap:anywhere}
.cby{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11.5px;color:var(--ok);margin-top:2px}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--danger-bg);color:var(--danger)}
.empty-list{font-size:13px;color:var(--muted);padding:2px 0}
.add{display:flex;gap:6px}
.add input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip:hover{border-style:solid;border-color:var(--accent);color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.05em;cursor:pointer}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-v="MGH"][aria-pressed="true"]{background:var(--c-mgh)}
.seg button[data-v="Admit"][aria-pressed="true"]{background:var(--c-admit)}
.seg button[data-v="Transfer"][aria-pressed="true"]{background:var(--c-transfer)}
.seg button[data-v="HAMA"][aria-pressed="true"]{background:var(--c-hama)}
.sub{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.sub h4{margin:0;font-size:13px}
.o-Discharged{--oc:var(--c-mgh)} .o-Absconded{--oc:var(--c-absc)} .o-HAMA{--oc:var(--c-hama)} .o-Transferred{--oc:var(--c-transfer)}
.outs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.outs button{border:0;border-radius:10px;padding:12px 6px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--oc);cursor:pointer}
.outs button:hover{filter:brightness(1.08)}
.outs button.sug{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--oc)}
.outs button:disabled{opacity:.35;cursor:not-allowed;filter:none}
.leave{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:2px solid var(--oc);background:var(--surface-2);font-size:14px}
.leave p{margin:0;color:var(--fg)}
.btn.o-fill{background:var(--oc);border-color:transparent;color:#fff}
.minor{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.lnk{border:0;background:none;padding:4px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk.danger{color:var(--danger)}
.lnk:disabled{opacity:.4;cursor:not-allowed}
.badge{font-family:var(--f-mono);font-weight:500;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px}
.dl-title{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.dl-tools{display:flex;flex-direction:column;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dl-tools input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface-2);font-size:15px}
.dl-f{display:flex;flex-wrap:wrap;gap:5px}
.dl-f button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.dl-f button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dl-day{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.dl-day h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dl-empty{padding:28px 4px;color:var(--muted);text-align:center}
.rec{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.rec.open{box-shadow:var(--shadow)}
.rec-h{appearance:none;border:0;background:transparent;text-align:left;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;width:100%;padding:10px 12px;cursor:pointer;color:var(--fg)}
.rec-h:hover{background:var(--surface-2)}
.oc{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--oc);padding:2px 8px;border-radius:6px;align-self:center}
.rec-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-name span{font-weight:400;color:var(--muted)}
.rec-time{font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:center;white-space:nowrap}
.rec-sub{grid-column:2/4;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-d{padding:4px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:14px}
.rec-d h5{margin:10px 0 2px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rec-d .mono{font-family:var(--f-mono);font-size:13px}
.rl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rl li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.rl .ok{color:var(--ok);font-weight:700}
.rl .no{color:var(--warn);font-weight:700}
.rl small{color:var(--muted);font-size:12px}
.rec-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--danger-bg);color:var(--danger);font-size:14px}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}
.ro .p-body input,.ro .p-body textarea,.ro .p-body select{pointer-events:none;opacity:.85}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (min-width:701px){body.panel-open .board,body.panel-open .top,body.panel-open .banner{margin-right:min(460px,100%)}}
@media (max-width:700px){
  .canvas{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;align-content:start}
  .tile{position:static;width:auto}
  .tile.expanded{grid-column:1/-1;width:auto}
  .t-bed{font-size:21px}
  #b-arrange{display:none}
  #b-dlist span.lbl{display:none}
  .sizer{display:none}
  .tile{transform:none}
  .row{grid-template-columns:1fr 64px 64px}
  .vitals{grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel{border-left:0}
  .top{gap:10px}
  .brand{flex:1}
  .stats{order:3;flex-basis:100%}
  #b-add span{display:none}
  #b-add{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<header class="top">
  <div class="brand"><h1>ER Board</h1><span class="sync" id="sync" data-s="connecting"><i></i><span>Connecting…</span></span></div>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <label class="sizer" for="f-size" title="Card size">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
      <input type="range" id="f-size" min="60" max="150" step="5" value="100" aria-label="Card size">
      <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
      <output id="size-out" for="f-size">100%</output>
    </label>
    <button class="btn" id="b-dlist" type="button" aria-label="Discharge list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span class="lbl">Discharge list</span><b class="badge" id="dl-count" title="Patients who left today">0</b></button>
    <button class="btn" id="b-arrange" aria-pressed="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
      <span>Move beds</span></button>
    <button class="btn primary" id="b-add" type="button" aria-label="Add bed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add bed</span></button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main class="board" id="board">
  <div class="canvas" id="canvas"></div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="f-bed" hidden>
  <div class="p-head">
    <input class="bed-input" id="f-bed" data-field="name" aria-label="Bed name" autocomplete="off">
    <button class="btn" id="p-close" type="button">Close</button>
  </div>
  <div class="p-body">
    <section class="sec">
      <h3>Patient <small id="los-text"></small></h3>
      <div class="row">
        <label class="fld">Name / initials<input id="f-pname" data-field="patient.name" autocomplete="off" placeholder="e.g. J.D."></label>
        <label class="fld">Age<input id="f-age" data-field="patient.age" inputmode="numeric" autocomplete="off"></label>
        <label class="fld">Sex<select id="f-sex" data-field="patient.sex"><option value="">–</option><option value="M">M</option><option value="F">F</option></select></label>
      </div>
      <label class="fld">Chief complaint<textarea id="f-cc" data-field="patient.cc" rows="2" placeholder="e.g. Chest pain, 2 hours"></textarea></label>
      <div class="inline"><label for="f-arr">Arrived</label><input type="time" id="f-arr"><span id="arr-hint"></span></div>
    </section>

    <section class="sec">
      <h3>Vital signs <small id="vit-meta" class="inline"></small></h3>
      <div class="vitals">
        <label class="fld">BP<input id="f-bp" data-field="vitals.bp" inputmode="numeric" placeholder="120/80" autocomplete="off"></label>
        <label class="fld">HR<input id="f-hr" data-field="vitals.hr" inputmode="numeric" placeholder="bpm" autocomplete="off"></label>
        <label class="fld">RR<input id="f-rr" data-field="vitals.rr" inputmode="numeric" placeholder="/min" autocomplete="off"></label>
        <label class="fld">Temp<input id="f-temp" data-field="vitals.temp" inputmode="decimal" placeholder="°C" autocomplete="off"></label>
        <label class="fld">SpO₂<input id="f-spo2" data-field="vitals.spo2" inputmode="numeric" placeholder="%" autocomplete="off"></label>
      </div>

    <section class="sec" data-list="dx">
      <h3>Diagnostics <small class="cnt"></small></h3>
      <ul class="checks"></ul>
      <form class="add"><input id="a-dx" placeholder="Add a test, e.g. CBC" autocomplete="off" aria-label="Add diagnostic"><button class="btn" type="submit">Add</button></form>
      <div class="chips"></div>
    </section>

    <section class="sec" data-list="tx">
      <h3>Therapeutics <small class="cnt"></small></h3>
      <ul class="checks"></ul>
      <form class="add"><input id="a-tx" placeholder="Add an order, e.g. Paracetamol 1 g IV" autocomplete="off" aria-label="Add therapeutic"><button class="btn" type="submit">Add</button></form>
      <div class="chips"></div>
    </section>

    <section class="sec">
      <h3>Disposition</h3>
      <div class="seg" id="dispo">
        <button type="button" data-v="MGH" aria-pressed="false">MGH</button>
        <button type="button" data-v="Admit" aria-pressed="false">ADMIT</button>
        <button type="button" data-v="Transfer" aria-pressed="false">TRANSFER</button>
        <button type="button" data-v="HAMA" aria-pressed="false">HAMA</button>
      </div>
      <label class="fld" id="dnote-wrap" hidden><span id="dnote-label">Notes</span><input id="f-dnote" data-field="dispoNote" autocomplete="off"></label>
      <div class="sub" id="meds-box" data-list="meds" hidden>
        <h4>Take-home meds <small class="cnt hint"></small></h4>
        <ul class="checks"></ul>
        <form class="add"><input id="a-meds" placeholder="e.g. Cefuroxime 500 mg BID x 7 days" autocomplete="off" aria-label="Add take-home med"><button class="btn" type="submit">Add</button></form>
      </div>
    </section>

    <section class="sec">
      <h3>Notes</h3>
      <label class="fld"><span class="hint">Anything the team should know</span><textarea id="f-notes" data-field="notes" rows="3"></textarea></label>
    </section>

    <section class="sec" id="wipe-sec">
      <h3>Patient leaving the ER</h3>
      <div class="outs" id="outs">
        <button type="button" class="o-Discharged" data-out="Discharged">Discharged</button>
        <button type="button" class="o-Absconded" data-out="Absconded">Absconded</button>
        <button type="button" class="o-HAMA" data-out="HAMA">HAMA</button>
        <button type="button" class="o-Transferred" data-out="Transferred">Transferred</button>
      </div>
      <div class="leave" id="leave" hidden>
        <p id="leave-text"></p>
        <div class="inline"><label for="f-leave-time">Time left</label><input type="time" id="f-leave-time"></div>
        <div class="actions"><button class="btn o-fill" id="leave-yes" type="button">Confirm</button><button class="btn" id="leave-no" type="button">Cancel</button></div>
      </div>
      <div class="minor">
        <button class="lnk" id="b-clear" type="button">Clear bed without saving</button>
        <button class="lnk danger" id="b-remove" type="button">Remove this bed from the board</button>
      </div>
      <div class="confirm" id="confirm" hidden>
        <span id="confirm-text"></span>
        <div><button class="btn danger" id="confirm-yes" type="button">Yes</button><button class="btn" id="confirm-no" type="button">Cancel</button></div>
      </div>
    </section>
  </div>
</aside>
<aside class="panel" id="dl" role="dialog" aria-labelledby="dl-title" hidden>
  <div class="p-head"><h2 class="dl-title" id="dl-title">Discharge list</h2><button class="btn" id="dl-close" type="button">Close</button></div>
  <div class="dl-tools">
    <input type="search" id="dl-q" placeholder="Search name, complaint or bed" aria-label="Search discharge list" autocomplete="off">
    <div class="dl-f" id="dl-f">
      <button type="button" data-f="All" aria-pressed="true">All</button>
      <button type="button" data-f="Discharged" aria-pressed="false">Discharged</button>
      <button type="button" data-f="Absconded" aria-pressed="false">Absconded</button>
      <button type="button" data-f="HAMA" aria-pressed="false">HAMA</button>
      <button type="button" data-f="Transferred" aria-pressed="false">Transferred</button>
    </div>
  </div>
  <div class="p-body" id="dl-body"></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
function merge(t, s){ for (const k in s){ const v = s[k]; if (isObj(v) && isObj(t[k])) merge(t[k], v); else t[k] = clone(v); } return t; }
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
function pathPatch(p, val){ const ks = p.split('.'); const out = {}; let c = out; ks.forEach((k, i) => { if (i === ks.length - 1) c[k] = val; else c = c[k] = {}; }); return out; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hhmm = ms => { const t = new Date(ms); return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; };
function timeToMs(val, baseMs){ const [h, m] = val.split(':').map(Number); const d = new Date(baseMs || Date.now()); d.setHours(h, m, 0, 0); if (d.getTime() > Date.now() + 60000) d.setDate(d.getDate() - 1); return d.getTime(); }
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
function fmtDur(ms){ if (!(ms > 0)) return ''; const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? `${h}h ${String(m % 60).padStart(2,'0')}m` : `${m}m`; }
function fmtLos(ms){ if (!ms) return ''; const m = Math.max(0, Math.floor((Date.now() - ms) / 60000)); const h = Math.floor(m / 60); return h ? `${h}h ${String(m % 60).padStart(2,'0')}m` : `${m}m`; }
const use = n => (window.claude && window.claude.use) ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);

const LISTS = {
  dx: { chips: ['CBC','Urinalysis','12-lead ECG','Chest X-ray','Na / K / Cl','BUN / Crea','CBG','Troponin I','ABG','Blood culture'] },
  tx: { chips: ['IV access','O2 support','IV fluids','Paracetamol','Nebulization','Foley catheter','NGT'] },
  meds: { chips: [] }
};
const DNOTE = { MGH:'Follow-up / advice', Admit:'Service / ward / room', Transfer:'Receiving hospital', HAMA:'Reason / waiver signed' };

const S = { db:null, user:null, me:null, mode:'connecting', loaded:false, canWrite:true,
  beds:new Map(), pending:new Map(), sent:new Map(), openId:null, arrange:false, dragging:null, confirm:null, expanded:new Set(),
  dis:new Map(), dlOpen:false, dlFilter:'All', dlQuery:'', dlExpanded:new Set(), dlConfirm:null, leave:null };
let SC = 1; try { const z = Number(localStorage.getItem('er-size')); if (z >= 60 && z <= 150) SC = z / 100; } catch {}
const scale = () => matchMedia('(max-width:700px)').matches ? 1 : SC;
try { (JSON.parse(localStorage.getItem('er-expanded') || '[]')).forEach(id => S.expanded.add(id)); } catch {}
function saveExpanded(){ try { localStorage.setItem('er-expanded', JSON.stringify([...S.expanded])); } catch {} }
const timers = {}, inflight = {};

/* ---------- data layer ---------- */
function view(id){
  const b = S.beds.get(id), s = S.sent.get(id), p = S.pending.get(id);
  if (!b && !s && !p) return null;
  const v = clone(b || {}); if (s) merge(v, s); if (p) merge(v, p); return v;
}
function allIds(){ return [...new Set([...S.beds.keys(), ...S.sent.keys(), ...S.pending.keys()])].filter(id => view(id)); }
function items(v, key){ const m = (v && v[key]) || {}; return Object.entries(m).filter(([, it]) => it && it.t).map(([id, it]) => ({id, ...it})).sort((a, b) => (a.o || 0) - (b.o || 0)); }
function hasPatient(v){ const p = v.patient || {}; return !!(p.name || p.age || p.cc || p.arrivedAt || items(v,'dx').length || items(v,'tx').length || v.dispo); }

function patch(id, p, delay = 700){
  if (!S.canWrite) { toast('This board is view-only for you.'); return; }
  p.updatedAt = Date.now();
  S.pending.set(id, merge(S.pending.get(id) || {}, p));
  render(); setSync();
  clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), delay);
}
async function flush(id){
  clearTimeout(timers[id]);
  while (inflight[id]) await inflight[id];
  const p = S.pending.get(id); if (!p) return;
  S.pending.delete(id);
  if (!S.db) { S.beds.set(id, merge(clone(S.beds.get(id) || {}), p)); render(); setSync(); return; }
  S.sent.set(id, p); setSync();
  const ref = S.db.collection('beds').doc(id);
  inflight[id] = ref.update(p)
    .catch(async e => { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); return ref.update(p); } throw e; })
    .catch(e => writeFailed(e, id))
    .finally(() => { inflight[id] = null; S.sent.delete(id); setSync(); render(); });
  await inflight[id];
}
async function createBed(id, data){
  if (!S.db) { S.beds.set(id, data); render(); return; }
  S.sent.set(id, data); render(); setSync();
  try { await S.db.collection('beds').doc(id).set(data); }
  catch (e) { writeFailed(e, id); }
  finally { S.sent.delete(id); render(); setSync(); }
}
async function replaceBed(id, data){
  clearTimeout(timers[id]); S.pending.delete(id);
  while (inflight[id]) await inflight[id];
  await createBed(id, data);
}
async function removeBed(id){
  clearTimeout(timers[id]); S.pending.delete(id);
  while (inflight[id]) await inflight[id];
  if (!S.db) { S.beds.delete(id); render(); return; }
  try { await S.db.collection('beds').doc(id).delete(); } catch (e) { writeFailed(e, id); }
}
function writeFailed(e, id){
  const code = e && e.code;
  if (code === 'invalid_argument' && id && !S.beds.has(id)) { toast('That bed was removed by someone else.'); return; }
  if (code === 'invalid_argument' || code === 'not_granted') { S.canWrite = false; toast("You can view this board but can't edit it. Ask the owner for edit access."); render(); return; }
  if (code === 'quota_exceeded') { toast('The board is full. Remove beds you no longer use, then try again.'); return; }
  if (code === 'revoked') { S.canWrite = false; toast('Your access to this board changed. Reload to continue.'); render(); return; }
  toast("Couldn't save. Check your connection and try again.");
}
function setSync(){
  const el = $('#sync'); let s = S.mode, t;
  if (S.mode === 'live' && (S.pending.size || S.sent.size)) s = 'saving';
  t = { connecting:'Connecting…', live:'Live · shared', saving:'Saving…', local:'Preview only', error:'Not connected' }[s] || '';
  if (S.mode === 'live' && !S.canWrite) t = 'Live · view only';
  el.dataset.s = s; el.lastElementChild.textContent = t;
}

/* ---------- board ---------- */
const tileEls = new Map();
function sortedIds(){ return allIds().sort((a, b) => { const A = view(a), B = view(b); return ((A.y||0) - (B.y||0)) || ((A.x||0) - (B.x||0)) || String(A.name).localeCompare(String(B.name), undefined, {numeric:true}); }); }
function tileHtml(v){
  const name = esc(v.name || 'Bed');
  if (!hasPatient(v)) return `<div class="t-head"><span class="t-bed">${name}</span></div><div class="t-empty"><b>Empty</b><span>Tap to add a patient</span></div>`;
  const p = v.patient || {}, vt = v.vitals || {};
  const dx = items(v,'dx'), tx = items(v,'tx'), meds = v.dispo === 'MGH' ? items(v,'meds') : [];
  const all = [...dx, ...tx, ...meds], done = all.filter(i => i.d).length, todo = all.length - done;
  const segs = all.length ? `<div class="segs" aria-hidden="true">${dx.map(i=>`<i class="${i.d?'d':''}"></i>`).join('')}${tx.map(i=>`<i class="tx ${i.d?'d':''}"></i>`).join('')}${meds.map(i=>`<i class="tx ${i.d?'d':''}"></i>`).join('')}</div>` : '';
  const pill = !all.length ? `<span class="pill none">No orders yet</span>` : todo ? `<span class="pill warn">${todo} to do</span>` : `<span class="pill ok">All done</span>`;
  const vit = [['BP',vt.bp],['HR',vt.hr],['RR',vt.rr],['T',vt.temp],['O₂',vt.spo2 ? vt.spo2 + '%' : '']].filter(x => x[1]);
  const agesex = [p.age, p.sex].filter(Boolean).join(' · ');
  if (S.expanded.has(v._id) && !S.arrange) return expandedHtml(v, {p, vt, dx, tx, meds, all, todo, pill, agesex});
  return `<div class="t-head"><span class="t-bed">${name}</span>${v.dispo ? `<span class="dchip ${esc(v.dispo)}">${esc(v.dispo)}</span>` : ''}</div>
    <div class="t-pt">${esc(p.name || 'Unnamed')}${agesex ? ` <span>${esc(agesex)}</span>` : ''}</div>
    <div class="t-cc">${esc(p.cc || '')}</div>
    ${vit.length ? `<div class="t-vit">${vit.map(([k,x]) => `<span><em>${k}</em> ${esc(x)}</span>`).join('')}</div>` : ''}
    ${segs}
    <div class="t-foot">${pill}<span class="los" title="Time in ER">${p.arrivedAt ? fmtLos(p.arrivedAt) : ''}</span></div>`;
}
function xList(key, list){
  if (!list.length) return '<div class="x-none">None yet</div>';
  return `<ul class="x-list">${list.map(it => `<li class="${it.d ? 'done' : ''}"><input type="checkbox" class="xcb" data-k="${key}" data-i="${esc(it.id)}" ${it.d ? 'checked' : ''} ${S.canWrite ? '' : 'disabled'} aria-label="Mark ${esc(it.t)} done"><span><span class="xt">${esc(it.t)}</span>${it.d ? `<span class="xby">Done ${esc(fmtTime(it.at))}${it.by ? ` · <span data-uid="${esc(it.by)}"></span>` : ''}</span>` : ''}</span></li>`).join('')}</ul>`;
}
function expandedHtml(v, {p, vt, dx, tx, meds, pill, agesex}){
  const cnt = l => l.length ? `<small>${l.filter(i => i.d).length} of ${l.length} done</small>` : '';
  const vit = [['BP',vt.bp],['HR',vt.hr],['RR',vt.rr],['Temp',vt.temp],['SpO₂',vt.spo2 ? vt.spo2 + '%' : '']].filter(x => x[1]);
  return `<div class="t-head"><span class="t-bed">${esc(v.name || 'Bed')}</span>${v.dispo ? `<span class="dchip ${esc(v.dispo)}">${esc(v.dispo)}</span>` : ''}</div>
    <div class="t-pt">${esc(p.name || 'Unnamed')}${agesex ? ` <span>${esc(agesex)}</span>` : ''}</div>
    ${p.cc ? `<div class="t-cc"><span style="color:var(--tile-muted)">CC:</span> ${esc(p.cc)}</div>` : ''}
    ${p.arrivedAt ? `<div class="los">Arrived ${esc(fmtTime(p.arrivedAt))} · in ER ${fmtLos(p.arrivedAt)}</div>` : ''}
    <div class="x-sec"><h5>Vital signs ${v.vitalsAt ? `<small>Taken ${esc(fmtTime(v.vitalsAt))}</small>` : ''}</h5>${vit.length ? `<div class="t-vit" style="border:0;padding:0;font-size:13px">${vit.map(([k,x]) => `<span><em>${k}</em> ${esc(x)}</span>`).join('')}</div>` : '<div class="x-none">Not entered</div>'}</div>
    <div class="x-sec"><h5>Diagnostics ${cnt(dx)}</h5>${xList('dx', dx)}</div>
    <div class="x-sec"><h5>Therapeutics ${cnt(tx)}</h5>${xList('tx', tx)}</div>
    <div class="x-sec"><h5>Disposition</h5>${v.dispo ? `<div class="x-dn"><b>${esc(v.dispo)}</b>${v.dispoNote ? ` · ${esc(v.dispoNote)}` : ''}</div>` : '<div class="x-none">Not decided</div>'}
      ${v.dispo === 'MGH' ? `<h5 style="margin-top:4px">Take-home meds ${cnt(meds)}</h5>${xList('meds', meds)}` : ''}</div>

  if (!S.dlOpen) { dl.hidden = true; return; }
  dl.hidden = false;
  if (matchMedia('(max-width:700px)').matches) $('#scrim').hidden = false;
  $('#dl-f').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.dlFilter)));
  const q = S.dlQuery.trim().toLowerCase();
  const rows = [...S.dis.entries()].filter(([, r]) => {
    if (S.dlFilter !== 'All' && r.outcome !== S.dlFilter) return false;
    if (!q) return true;
    const p = (r.chart || {}).patient || {};
    return [p.name, p.cc, r.bed, r.outcome].some(x => String(x || '').toLowerCase().includes(q));
  }).sort((a, b) => b[1].at - a[1].at);
  let html = '';
  if (!rows.length) html = `<div class="dl-empty">${S.dis.size ? 'No patients match.' : 'No one has left yet. When a patient leaves, open their bed and press Discharged, Absconded, HAMA or Transferred at the bottom of the panel.'}</div>`;
  else { let cur = null; rows.forEach(([id, r]) => { const d = dayLabel(r.at); if (d !== cur) { if (cur !== null) html += '</div>'; html += `<div class="dl-day"><h4>${esc(d)}</h4>`; cur = d; } html += recHtml(id, r); }); html += '</div>'; }
  const body = $('#dl-body'); if (body._html !== html) { body.innerHTML = html; body._html = html; }
  resolveNames([...body.querySelectorAll('[data-uid]')].map(e => e.dataset.uid));
}
$('#b-dlist').addEventListener('click', () => S.dlOpen ? closeDList() : openDList());
$('#dl-q').addEventListener('input', e => { S.dlQuery = e.target.value; renderDList(); });
$('#dl').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'dl-close') return closeDList();
  if (t.dataset.f) { S.dlFilter = t.dataset.f; return renderDList(); }
  if (t.dataset.rec) { const id = t.dataset.rec; S.dlConfirm = null; if (S.dlExpanded.has(id)) S.dlExpanded.delete(id); else S.dlExpanded.add(id); return renderDList(); }
  if (t.dataset.rback) return restoreRec(t.dataset.rback);
  if (t.dataset.rdel) { S.dlConfirm = t.dataset.rdel; return renderDList(); }
  if (t.dataset.rdelNo) { S.dlConfirm = null; return renderDList(); }
  if (t.dataset.rdelYes) { S.dlConfirm = null; deleteRec(t.dataset.rdelYes); toast('Record deleted.'); }
});
function applySize(){ $('#canvas').style.setProperty('--s', SC); $('#f-size').value = Math.round(SC * 100); $('#size-out').textContent = Math.round(SC * 100) + '%'; }
$('#f-size').addEventListener('input', e => { SC = Number(e.target.value) / 100; $('#canvas').classList.add('resizing'); applySize(); renderBoard(); });
$('#f-size').addEventListener('change', () => { $('#canvas').classList.remove('resizing'); try { localStorage.setItem('er-size', Math.round(SC * 100)); } catch {} });
applySize();
$('#canvas').addEventListener('click', e => { if (e.target.closest('[data-act="add"]')) addBed(); });
$('#b-arrange').addEventListener('click', () => { S.arrange = !S.arrange; if (S.arrange) S.openId = null; render(); });

function nextName(){ const names = new Set(allIds().map(id => String(view(id).name).toLowerCase())); let n = allIds().length + 1; while (names.has('bed ' + n)) n++; return 'Bed ' + n; }
function freeSpot(){
  const pts = allIds().map(id => view(id)); const W = 240, H = 300;
  const cols = Math.max(1, Math.floor((($('#board').clientWidth || 1000) / scale() - 40) / W));
  for (let i = 0; i < 400; i++) { const x = 40 + (i % cols) * W, y = 40 + Math.floor(i / cols) * H;
    if (!pts.some(p => Math.abs((p.x||0) - x) < 200 && Math.abs((p.y||0) - y) < 220)) return {x, y}; }
  return {x:40, y:40};
}
function addBed(){
  if (!S.canWrite) return;
  const id = S.db ? S.db.collection('beds').doc().id : uid();
  const {x, y} = freeSpot();
  createBed(id, {name:nextName(), x, y, updatedAt:Date.now()});
  openPanel(id);
  setTimeout(() => { const f = $('#f-bed'); f.focus(); f.select(); }, 30);
}

/* tap to open / drag to arrange */
let drag = null;
$('#canvas').addEventListener('pointerdown', e => {
  const el = e.target.closest('.tile'); if (!el) return;
  if (!S.arrange || e.target.closest('input, button')) return;
  e.preventDefault(); el.setPointerCapture(e.pointerId);
  const v = view(el.dataset.id);
  drag = {id:el.dataset.id, el, sx:e.clientX, sy:e.clientY, ox:v.x || 0, oy:v.y || 0, moved:false};
  S.dragging = drag.id; el.classList.add('dragging');
});
$('#canvas').addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  const k = scale(); drag.x = Math.max(0, drag.ox + dx / k); drag.y = Math.max(0, drag.oy + dy / k);
  drag.el.style.left = drag.x * k + 'px'; drag.el.style.top = drag.y * k + 'px';
});
function endDrag(){
  if (!drag) return; const d = drag; drag = null; S.dragging = null; d.el.classList.remove('dragging');
  if (d.moved) { const x = Math.round(d.x / 10) * 10, y = Math.round(d.y / 10) * 10; patch(d.id, {x, y}, 0); } else render();
}
$('#canvas').addEventListener('pointerup', endDrag);
$('#canvas').addEventListener('pointercancel', endDrag);
function tileTap(el, target){
  const id = el.dataset.id, v = view(id); if (!v) return;
  const act = target.closest('[data-act]');
  if (act && act.dataset.act === 'edit') return openPanel(id);
  if (target.closest('input, label')) return;
  if (!hasPatient(v)) return openPanel(id);
  if (S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id);
  saveExpanded(); renderBoard();
}
/* One tap expands or shrinks a card; a quick second tap on the same card opens the edit panel instead. */
let tapTimer = null, tapId = null;
$('#canvas').addEventListener('click', e => {
  const el = e.target.closest('.tile'); if (!el || S.arrange) return;
  const id = el.dataset.id, v = view(id), tgt = e.target;
  if (tgt.closest('input, label')) return;
  if (!v || !hasPatient(v) || tgt.closest('[data-act="edit"]')) { clearTimeout(tapTimer); tapTimer = tapId = null; return tileTap(el, tgt); }
  if (tapTimer && tapId === id) { clearTimeout(tapTimer); tapTimer = tapId = null; return openPanel(id); }
  clearTimeout(tapTimer); tapId = id;
  tapTimer = setTimeout(() => { tapTimer = tapId = null; tileTap(el, tgt); }, 240);
});
$('#canvas').addEventListener('change', e => {
  const cb = e.target.closest('.xcb'); if (!cb) return; const id = cb.closest('.tile').dataset.id;
  patch(id, {[cb.dataset.k]:{[cb.dataset.i]: cb.checked ? {d:true, by:S.me || null, at:Date.now()} : {d:false, by:null, at:null}}}, 0);
});

let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
setInterval(() => { if (!drag) { renderBoard(); if (S.openId && S.mode !== 'connecting') { const v = view(S.openId); if (v && (v.patient||{}).arrivedAt) $('#arr-hint').innerHTML = `In ER <b>${fmtLos(v.patient.arrivedAt)}</b>`; } } }, 30000);
addEventListener('resize', () => renderBoard());

function banner(msg, info){ const b = $('#banner'); b.hidden = !msg; b.textContent = msg || ''; b.classList.toggle('info', !!info); }

/* ---------- start ---------- */
async function init(){
  render();
  const loadTimer = setTimeout(() => { if (!S.loaded && S.mode === 'connecting') { banner("The shared board is taking a while to load. What you see may be out of date."); } }, 10000);
  const [db, user] = await Promise.all([use('db'), use('user')]);
  S.user = user;
  if (user) {
    try { S.me = await user.id(); } catch {}
    try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch {}
  }
  if (!db) {
    clearTimeout(loadTimer);
    S.mode = 'local';
    banner('Preview: this copy is not connected to the shared board, so changes stay on this screen.', true);
    [['Bed 1',40,40],['Bed 2',280,40],['Bed 3',520,40]].forEach(([name,x,y]) => S.beds.set(uid(), {name, x, y}));
    render(); return;
  }
  S.db = db;
  if (!S.canWrite) banner('You have view-only access to this board.', true);
  db.collection('discharges').orderBy('at', 'desc').limit(500).onSnapshot(snap => {
    S.dis = new Map(snap.docs.map(d => [d.id, d.data()])); renderDList(); renderStats();
  }, () => {});
  db.collection('beds').onSnapshot(snap => {
    S.beds = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (!snap.metadata.fromCache) { S.loaded = true; S.mode = 'live'; clearTimeout(loadTimer); if (S.canWrite) banner(''); }
    else if (S.mode === 'connecting') S.mode = 'live';
    if (!drag) render();
  }, err => {
    clearTimeout(loadTimer);
    S.mode = 'error'; S.canWrite = false;
    banner(err && err.code === 'revoked' ? 'Your access to this board changed. Reload to continue.' : "Lost connection to the shared board. Reopen this page to reconnect.");
    render();
  });
}
init();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderBoard());
})();
</script>
